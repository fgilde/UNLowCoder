# yaml-language-server: $schema=https://fgilde.github.io/QuickRun/quickrun.schema.json
name: UNLowCoder
description: "A library and a source generator with no app to start. Sample/Program.cs is a scratch pad that downloads a multi-gigabyte OSM extract and then waits on Console.ReadLine, so this builds the solution and runs the tests instead."

requires:
  - tool: dotnet
    version: ">=9.0"
    install: https://dotnet.microsoft.com/download

setup:
  - run: dotnet restore UNLowCoder.sln
  - run: dotnet build UNLowCoder.sln -c Release

tasks:
  - name: test
    run: dotnet test UNLowCoder.sln -c Release --no-build
